plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def detectChangelogVersion = {
    def changelogFile = file("../../changelog.md")
    if (changelogFile.exists()) {
        def matcher = (changelogFile.getText("UTF-8") =~ /(?m)^###\s+\[MikhPay\s+v([0-9.]+)\]/)
        if (matcher.find()) {
            return matcher.group(1).replaceAll(/\.0$/, "")
        }
    }
    return "3.2"
}

def detectChangelogVersionCode = {
    def changelogFile = file("../../changelog.md")
    if (changelogFile.exists()) {
        def matcher = (changelogFile.getText("UTF-8") =~ /(?m)^###\s+\[MikhPay\s+v([0-9.]+)\]/)
        def count = 0
        while (matcher.find()) {
            count++
        }
        if (count > 0) return count
    }
    return 3
}

android {
    namespace = 'com.mikhpay.forwarder'
    compileSdk 34

    defaultConfig {
        applicationId "com.mikhpay.forwarder"
        minSdk 23
        targetSdk 34
        versionCode detectChangelogVersionCode()
        versionName detectChangelogVersion()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("MIKHPAY_KEYSTORE_FILE") ?: "../mikhpay.jks"
            storeFile file(ksPath)
            storePassword System.getenv("MIKHPAY_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("MIKHPAY_KEY_ALIAS") ?: "mikhpay"
            keyPassword System.getenv("MIKHPAY_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            def ksFile = signingConfigs.release.storeFile
            if (ksFile != null && ksFile.exists() && !signingConfigs.release.storePassword.isEmpty()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // OkHttp for network requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
